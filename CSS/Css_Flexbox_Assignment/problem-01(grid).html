<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hiring Partners</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #fffafa;

    font-family: Arial;

    text-align: center;
}

section {

    max-width: 950px;

    margin: 70px auto;

    padding: 20px;
}

.subtitle {

    color: #666;

    font-weight: bold;
}

h1 {

    font-size: 24px;

    margin-bottom: 30px;
}

.logos {

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 18px;
}

.logo {

    height: 75px;

    background: white;

    border-radius: 9px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

    box-shadow: 0 3px 12px #0001;
}

.logo:nth-child(2n) {
    color: #e33;
}

.logo:nth-child(3n) {
    color: #2875dd;
}

button {

    margin-top: 30px;

    padding: 10px 18px;

    background: white;

    border: 1px solid #e99;

    color: #d66;

    border-radius: 5px;
}

@media(max-width:700px) {

    .logos {

        grid-template-columns: repeat(2, 1fr);

    }

}

</style>

</head>


<body>


<section>

<p class="subtitle">
Have a Dream Company In Mind?
</p>

<h1>
Meet Our 700+ Hiring Partners
</h1>


<div class="logos">

<div class="logo">EASY1</div>
<div class="logo">DREAM11</div>
<div class="logo">URBAN PIPER</div>
<div class="logo">Aimery</div>

<div class="logo">paytm</div>
<div class="logo">WebEngage</div>
<div class="logo">BharatPe</div>
<div class="logo">SWIGGY</div>

<div class="logo">Vyapar</div>
<div class="logo">PagarBook</div>
<div class="logo">smallcase</div>
<div class="logo">ShareChat</div>

<div class="logo">OLA</div>
<div class="logo">IBM</div>
<div class="logo">BYJU'S</div>
<div class="logo">AJIO</div>

</div>


<button>
SEE MORE PARTNERS →
</button>

</section>


</body>

</html>
